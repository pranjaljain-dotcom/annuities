<!DOCTYPE html>

<head>
  <meta charset="UTF-8" />

  <title>Annuities – What if you live longer than your money does?</title>
  <link rel="stylesheet" href="../../components.css?v=3" />
  <style>
    /* This screen is two full "panels" (intro typewriter + annuity overview)
       stacked vertically inside a fixed-height .phone, with a single
       translateY transform on #screenStack sliding from one to the other.
       The header and CTA are NOT part of that sliding stack — they're fixed
       overlays on top of it (z-index above), so they never move; only their
       text/icon colors crossfade (dark-on-dark -> dark-on-light) in sync
       with the content push. Each panel keeps its own full-height
       background gradient, so the transparent header/CTA windows still
       show a smooth, continuous color shift as the stack slides beneath
       them, the same "transparent header over a moving backdrop" trick
       used on the other education screens. */
    .phone { height: 812px; overflow: hidden; position: relative; }

    .header-overlay { position: absolute; top: 0; left: 0; width: 100%; z-index: 10; }
    .header-overlay .status-bar, .header-overlay .nav { background: transparent; }
    .header-overlay .status-bar__time { color: #fff; transition: color 900ms ease; }
    .header-overlay.is-light .status-bar__time { color: #000; }
    .header-overlay .status-bar__icons svg rect,
    .header-overlay .status-bar__icons svg circle,
    .header-overlay .status-bar__icons svg path {
      fill: #fff; stroke: #fff;
      transition: fill 900ms ease, stroke 900ms ease;
    }
    .header-overlay.is-light .status-bar__icons svg rect,
    .header-overlay.is-light .status-bar__icons svg circle,
    .header-overlay.is-light .status-bar__icons svg path { fill: #000; stroke: #000; }
    .header-overlay .nav__logo svg path { fill: #fff; transition: fill 900ms ease; }
    .header-overlay.is-light .nav__logo svg path { fill: #056257; }
    .header-overlay .nav__help-label { color: #e3f8f6; transition: color 900ms ease; }
    .header-overlay.is-light .nav__help-label { color: #525252; }
    .header-overlay .nav__help-number { color: #fff; transition: color 900ms ease; }
    .header-overlay.is-light .nav__help-number { color: #04463e; }

    /* No back button on either panel (it's an entry screen) — the logo
       takes the back button's usual spot on the left instead of being
       centered. */
    .nav__logo { left: 16px; transform: translateY(-50%); }

    .cta-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      z-index: 10;
      padding: 16px;
      opacity: 0;
      transition: opacity 900ms ease;
    }
    .cta-overlay.is-visible { opacity: 1; }
    .cta-overlay button {
      width: 100%;
      min-height: 64px;
      background: #056257;
      border: 1px solid #272727;
      border-radius: 8px;
      box-shadow: 0px 1px 2px rgba(16, 24, 40, 0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Hauss', sans-serif;
      font-weight: 500;
      font-size: 19px;
      line-height: 24px;
      color: #ffffff;
      cursor: pointer;
    }

    @media (max-width: 480px) {
      html, body { background: #0b4368; }
      body { padding: 0; display: block; }
      .phone { width: 100%; border-radius: 0; box-shadow: none; margin: 0; }
    }

    .screen-stack {
      display: flex;
      flex-direction: column;
      width: 100%;
      transition: transform 900ms cubic-bezier(0.65, 0, 0.35, 1);
    }
    .screen-stack.is-pushed { transform: translateY(-812px); }
    .screen-panel {
      width: 100%;
      height: 812px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
    }
    /* Reserves the space the fixed header overlay sits on top of, so each
       panel's own content lands exactly where it would if the header were
       still part of this panel's normal flow. */
    .header-spacer { height: 96px; flex-shrink: 0; }

    /* ---------- Panel 1: typewriter intro ---------- */
    .screen-panel--intro { background: linear-gradient(180deg, #0b4368 0%, #078476 33%); }

    .intro-content { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 0 16px; }
    .intro-title { text-align: center; }

    .intro-title h1 {
      margin: 0 0 16px 0;
      font-family: 'Portada', serif;
      font-weight: 600;
      font-size: 33px;
      line-height: 40px;
      letter-spacing: -0.08px;
      color: #ffffff;
    }
    /* Every character of the headline is rendered (invisible) from the
       start, so the browser computes the final 3-line wrap once and it
       never changes as characters reveal — otherwise, typing character
       by character via textContent re-wraps the paragraph on every
       keystroke, which reads as words jumping between lines mid-type. */
    .intro-title h1 .char { opacity: 0; }
    .intro-title h1 .char.is-visible { opacity: 1; }
    .intro-title .cursor {
      display: inline-block;
      margin-left: 2px;
      animation: blink 800ms step-end infinite;
    }
    .intro-title .cursor.is-hidden { display: none; }
    @keyframes blink { 50% { opacity: 0; } }

    .intro-title p {
      margin: 0;
      font-family: 'Hauss', sans-serif;
      font-weight: 400;
      font-size: 19px;
      line-height: 24px;
      color: #ffffff;
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transition: opacity 500ms ease, max-height 500ms ease;
    }
    .intro-title p.is-visible { max-height: 100px; opacity: 1; }

    /* ---------- Panel 2: annuity overview ---------- */
    .screen-panel--overview { background: linear-gradient(115deg, #ebfcf4 25%, #e3f8f6 125%); }

    .overview-hero { position: relative; flex: 1; }

    .overview-title {
      position: absolute;
      top: 36px;
      left: 16px;
      right: 16px;
      margin: 0;
      font-family: 'Portada', serif;
      font-weight: 600;
      font-size: 33px;
      line-height: 40px;
      letter-spacing: -0.08px;
      color: #05594f;
    }

    .overview-subtext {
      position: absolute;
      top: 476px;
      left: 16px;
      right: 16px;
      margin: 0;
      font-family: 'Hauss', sans-serif;
      font-weight: 500;
      font-size: 16px;
      line-height: 20px;
      color: #7e7e7e;
    }

    .overview-logos { position: absolute; left: 0; right: 0; }
    .overview-logos img { position: absolute; display: block; }
    .overview-logos .logo--american-national { left: 21px; top: 535.93px; width: 98.513px; height: 16.843px; }
    .overview-logos .logo--athene { left: 137.99px; top: 535.93px; width: 98.513px; height: 16.525px; }
    .overview-logos .logo--corebridge { left: 254.97px; top: 523px; width: 89.028px; height: 29.557px; }
    .overview-logos .logo--protective { left: 354px; top: 531px; width: 95.861px; height: 19.997px; }
  </style>

  <script src="../../components.js?v=3"></script>
  <script>
    document.getElementById('btnGetStarted').addEventListener('click', function () {
      EDS.navigate('../goals-step/');
    });

    (function () {
      var HEADLINE = 'What if you live longer than your money does?';
      var CHAR_DELAY = 45;
      var SUBTEXT_DELAY = 1000;
      var PUSH_DELAY = 1200; // hold on the finished intro before pushing up

      var headlineText = document.getElementById('headlineText');
      var cursor = document.getElementById('cursor');
      var subtext = document.getElementById('subtext');
      var screenStack = document.getElementById('screenStack');
      var headerOverlay = document.getElementById('headerOverlay');
      var ctaOverlay = document.getElementById('ctaOverlay');

      // Render every character as its own (invisible) span up front, so
      // the h1's line-wrap is fixed against the full final string from
      // frame 1 — see the .char comment in the <style> block above.
      var chars = HEADLINE.split('').map(function (ch) {
        var span = document.createElement('span');
        span.className = 'char';
        span.textContent = ch;
        return span;
      });
      chars.forEach(function (span) { headlineText.appendChild(span); });
      headlineText.appendChild(cursor);

      var typeTimeoutId = null;
      var subtextTimeoutId = null;
      var pushTimeoutId = null;
      var isFinalized = false;
      var charIndex = 0;

      function typeStep() {
        if (isFinalized) return;
        chars[charIndex].classList.add('is-visible');
        charIndex++;
        // Keep the cursor immediately after the last revealed character
        // instead of at the very end of the (already fully-laid-out) text.
        if (charIndex < chars.length) {
          headlineText.insertBefore(cursor, chars[charIndex]);
        } else {
          headlineText.appendChild(cursor);
        }
        if (charIndex < chars.length) {
          typeTimeoutId = setTimeout(typeStep, CHAR_DELAY);
        } else {
          subtextTimeoutId = setTimeout(revealSubtext, SUBTEXT_DELAY);
        }
      }

      function revealSubtext() {
        if (isFinalized) return;
        cursor.classList.add('is-hidden');
        subtext.classList.add('is-visible');
        pushTimeoutId = setTimeout(pushToOverview, PUSH_DELAY);
      }

      // The header/CTA color crossfade and the content push all fire at
      // once, on the same 900ms transition, so the fixed header/CTA read
      // as part of the same continuous motion instead of a separate step.
      function pushToOverview() {
        if (isFinalized) return;
        screenStack.classList.add('is-pushed');
        headerOverlay.classList.add('is-light');
        ctaOverlay.classList.add('is-visible');
      }

      typeTimeoutId = setTimeout(typeStep, CHAR_DELAY);

      // Jump straight to the fully-settled end state (overview panel in
      // view, header/CTA already in their light/visible state), skipping
      // the animation — same pattern used on the other education screens
      // for a bfcache restore.
      function setFinalState() {
        isFinalized = true;
        clearTimeout(typeTimeoutId);
        clearTimeout(subtextTimeoutId);
        clearTimeout(pushTimeoutId);
        chars.forEach(function (span) { span.classList.add('is-visible'); });
        cursor.classList.add('is-hidden');
        subtext.classList.add('is-visible');
        screenStack.classList.add('is-pushed');
        headerOverlay.classList.add('is-light');
        ctaOverlay.classList.add('is-visible');
      }

      window.addEventListener('pageshow', function (event) {
        if (event.persisted) setFinalState();
      });
    })();
  </script>
