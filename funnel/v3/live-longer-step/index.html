  <style>
    /* Same dark-gradient backdrop as the other education screens, living on
       .phone itself so the header (outside #slideInner) and the scrolling
       content always show the exact same continuous gradient. */
    .phone { background: linear-gradient(180deg, #0b4368 0%, #078476 33%); }
    .status-bar, .nav { background: transparent; }
    .status-bar__time { color: #fff; }
    .nav__help-label { color: #e3f8f6; }
    .nav__help-number { color: #fff; }

    /* This screen has no back button (it's an entry screen) — the logo
       takes the back button's usual spot on the left instead of being
       centered. */
    .nav__logo { left: 16px; transform: translateY(-50%); }

    @media (max-width: 480px) {
      html, body { background: #0b4368; }
      body { padding: 0; display: block; }
      .phone { width: 100%; border-radius: 0; box-shadow: none; margin: 0; }
    }

    :root {
      --bright-cypress: #078476;
      --neptune: #0b4368;
      --light-cypress: #e3f8f6;
      --white: #ffffff;
    }

    /* No CTA/footer on this screen, so .content just centers the title
       block in the full remaining height below the header. */
    .content { justify-content: center; padding: 0 16px; }

    .title h1 {
      margin: 0 0 16px 0;
      font-family: 'Portada', serif;
      font-weight: 600;
      font-size: 33px;
      line-height: 40px;
      letter-spacing: -0.08px;
      color: var(--white);
      min-height: 120px; /* reserve 3 lines so the subtext below doesn't jump as it types */
    }
    .title .cursor {
      display: inline-block;
      margin-left: 2px;
      animation: blink 800ms step-end infinite;
    }
    .title .cursor.is-hidden { display: none; }
    @keyframes blink { 50% { opacity: 0; } }

    .title p {
      margin: 0;
      font-family: 'Hauss', sans-serif;
      font-weight: 400;
      font-size: 19px;
      line-height: 24px;
      color: var(--white);
      opacity: 0;
      transition: opacity 500ms ease;
    }
    .title p.is-visible { opacity: 1; }
  </style>
</head>

  <script>
    (function () {
      var HEADLINE = 'What if you live longer than your money does?';
      var CHAR_DELAY = 45;
      var SUBTEXT_DELAY = 1000;

      var headlineText = document.getElementById('headlineText');
      var cursor = document.getElementById('cursor');
      var subtext = document.getElementById('subtext');

      var typeTimeoutId = null;
      var subtextTimeoutId = null;
      var isFinalized = false;
      var charIndex = 0;

      function typeStep() {
        if (isFinalized) return;
        headlineText.textContent = HEADLINE.slice(0, charIndex);
        charIndex++;
        if (charIndex <= HEADLINE.length) {
          typeTimeoutId = setTimeout(typeStep, CHAR_DELAY);
        } else {
          subtextTimeoutId = setTimeout(revealSubtext, SUBTEXT_DELAY);
        }
      }

      function revealSubtext() {
        if (isFinalized) return;
        cursor.classList.add('is-hidden');
        subtext.classList.add('is-visible');
      }

      typeTimeoutId = setTimeout(typeStep, CHAR_DELAY);

      // Jump straight to the fully-settled end state (full headline, no
      // cursor, subtext visible), skipping the animation — same pattern
      // used on the other education screens for a bfcache restore.
      function setFinalState() {
        isFinalized = true;
        clearTimeout(typeTimeoutId);
        clearTimeout(subtextTimeoutId);
        headlineText.textContent = HEADLINE;
        cursor.classList.add('is-hidden');
        subtext.classList.add('is-visible');
      }

      window.addEventListener('pageshow', function (event) {
        if (event.persisted) setFinalState();
      });
    })();
  </script>
